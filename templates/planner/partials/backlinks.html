{% for link in links %}
  <a href="{{ link.task_url }}" target="_blank" rel="noopener noreferrer" class="pill-planner"
     title="Åbn kortet i Microsoft Planner{% if link.current_title is None %} (findes ikke længere i den synkroniserede plan){% endif %}">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v10"/></svg>
    Planner: {{ link.current_title|default:link.task_title|truncatechars:60 }} ↗
  </a>
{% endfor %}
