{% comment %}
  "Knyt til Chronicle" for one card: appended to the card, replaced by the
  card again when a choice is made. Linking puts a label and a link back
  to Chronicle on the card in Planner.
{% endcomment %}
<div class="planner-link-form" role="group" aria-label="Knyt {{ task.title }} til Chronicle">
  <div class="label-eyebrow">Knyt til Chronicle</div>
  <div class="flex flex-wrap gap-2">
    <button type="button" class="btn btn-sm" hx-post="{% url 'planner:link' task.id %}" hx-vals='{"action": "priority"}'
            hx-target="closest .planner-card" hx-swap="outerHTML">Ny prioriteret opgave</button>
    <button type="button" class="btn btn-sm" hx-post="{% url 'planner:link' task.id %}" hx-vals='{"action": "case"}'
            hx-target="closest .planner-card" hx-swap="outerHTML">Ny sag (planlagt opgave)</button>
  </div>
  {% if priorities or cases %}
    <label class="planner-link-existing">
      <span>eller en eksisterende</span>
      <select name="target" class="input">
        {% if priorities %}
          <optgroup label="Prioriterede opgaver">
            {% for item in priorities %}<option value="p{{ item.pk }}">{{ item.title }}</option>{% endfor %}
          </optgroup>
        {% endif %}
        {% if cases %}
          <optgroup label="Åbne sager">
            {% for case in cases %}<option value="c{{ case.pk }}">#{{ case.pk }} {{ case.title }} ({{ case.get_kind_display|lower }})</option>{% endfor %}
          </optgroup>
        {% endif %}
      </select>
    </label>
    <div class="flex gap-2">
      <button type="button" class="btn btn-sm btn-primary" hx-post="{% url 'planner:link' task.id %}"
              hx-vals='{"action": "existing"}' hx-include="previous select"
              hx-target="closest .planner-card" hx-swap="outerHTML">Knyt</button>
      <button type="button" class="btn btn-sm btn-ghost" onclick="this.closest('.planner-link-form').remove()">Annuller</button>
    </div>
  {% else %}
    <button type="button" class="btn btn-sm btn-ghost" onclick="this.closest('.planner-link-form').remove()">Annuller</button>
  {% endif %}
</div>
