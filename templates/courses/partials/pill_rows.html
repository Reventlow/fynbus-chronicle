{% comment %}One row per linked course item, under a list row that is itself a link.{% endcomment %}
{% for link in links %}
  <a href="{{ link.course_url }}" class="incident-row planner-subrow" title="Åbn kursusmaterialet">
    <div class="incident-title" style="font-weight: 400; font-size: 13px;">
      <span style="color: var(--ink-5);" aria-hidden="true">↳</span>
      <span class="pill-course">{% include 'courses/partials/cap_icon.html' %} Kursus</span>
      {{ link.course_label|truncatechars:80 }}
    </div>
    <span style="color: var(--ink-5);" aria-hidden="true">↗</span>
  </a>
{% endfor %}
