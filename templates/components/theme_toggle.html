{# Light/dark toggle for pages without the sidebar (the login page). #}
<button type="button" @click="darkMode = !darkMode" class="icon-btn"
        :title="darkMode ? 'Skift til lyst tema' : 'Skift til mørkt tema'"
        :aria-label="darkMode ? 'Skift til lyst tema' : 'Skift til mørkt tema'">
  <svg x-show="!darkMode" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg x-show="darkMode" x-cloak width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10l1.4 1.4M3 12h2m14 0h2M5.6 18.4l1.4-1.4m10-10l1.4-1.4"/></svg>
</button>
