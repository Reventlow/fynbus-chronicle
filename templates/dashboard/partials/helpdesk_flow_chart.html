{% comment %}
Flow chart — new vs closed, parent provides card wrapper. Uses a
chart-specific RGB palette (higher chroma than the editorial soft tokens)
so the two series stay visually distinct, and a hardcoded light/dark
tooltip palette so contrast is reliable across browsers.
{% endcomment %}
<div style="padding: 0 24px 16px;">
  <div class="relative" style="height: 240px;">
    <canvas id="helpdesk-flow-chart"></canvas>
  </div>
</div>

<script>
(function() {
  function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

  setTimeout(function() {
    fetch('{% url "dashboard:api-helpdesk-data" %}', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(data => {
      if (!data.weeks || data.weeks.length === 0) {
        document.getElementById('helpdesk-flow-chart').parentElement.innerHTML =
          '<p style="text-align:center; color:var(--ink-4); padding:32px 0;">Ingen data tilgængelig</p>';
        return;
      }
      const isDark = document.documentElement.classList.contains('dark');
      const cs = getComputedStyle(document.documentElement);
      // Parse a CSS custom property into [r,g,b]. Tailwind/cssnano may
      // minify `rgb(r, g, b)` to `#rrggbb` so we accept both forms.
      const rgbVar = name => {
        const v = cs.getPropertyValue(name).trim();
        const rgbM = v.match(/rgb\s*\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
        if (rgbM) return [parseInt(rgbM[1]), parseInt(rgbM[2]), parseInt(rgbM[3])];
        const hexM = v.match(/^#?([0-9a-f]{6})$/i);
        if (hexM) {
          const h = hexM[1];
          return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
        }
        return [0, 0, 0];
      };
      // OKLCH → sRGB. Newer Chromium preserves the authored oklch() form
      // when serialising getComputedStyle().color, so the previous generic
      // number-extraction regex picked up `H=80` as `B=80` and rendered
      // the line near-navy.
      const oklchToRgb = (L, C, H) => {
        const a = C * Math.cos(H * Math.PI / 180);
        const b = C * Math.sin(H * Math.PI / 180);
        const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
        const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
        const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
        let r =  4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
        let g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
        let bl = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
        const enc = x => x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055;
        const clamp = x => Math.max(0, Math.min(1, x));
        return [
          Math.round(clamp(enc(r))  * 255),
          Math.round(clamp(enc(g))  * 255),
          Math.round(clamp(enc(bl)) * 255),
        ];
      };
      const probeRgb = css => {
        const probe = document.createElement('span');
        probe.style.cssText = 'position:absolute;left:-9999px;visibility:hidden;color:' + css;
        document.body.appendChild(probe);
        const computed = getComputedStyle(probe).color;
        document.body.removeChild(probe);
        const rgbM = computed.match(/rgba?\s*\(\s*(\d+(?:\.\d+)?)[\s,]+(\d+(?:\.\d+)?)[\s,]+(\d+(?:\.\d+)?)/i);
        if (rgbM) return [Math.round(+rgbM[1]), Math.round(+rgbM[2]), Math.round(+rgbM[3])];
        const oklM = computed.match(/oklch\s*\(\s*(\d*\.?\d+%?)\s+(\d*\.?\d+)\s+(\d*\.?\d+)/i);
        if (oklM) {
          const L = oklM[1].endsWith('%') ? parseFloat(oklM[1]) / 100 : parseFloat(oklM[1]);
          return oklchToRgb(L, parseFloat(oklM[2]), parseFloat(oklM[3]));
        }
        const hexM = computed.match(/^#([0-9a-f]{6})$/i);
        if (hexM) {
          const h = hexM[1];
          return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
        }
        return [0, 0, 0];
      };

      // Multi-series chart — keep distinct line colours so the two series
      // stay visually separable (UI-expert guardrail). Only the area fill
      // under "Nye sager" picks up --accent so the editorial accent still
      // washes through the chart when the user changes the tweak.
      const buildPalette = () => ({
        info:    rgbVar('--chart-info'),
        good:    rgbVar('--chart-good'),
        accent:  probeRgb('var(--accent)'),
        ink:     isDark ? [240, 240, 240] : [25, 30, 38],
        ink2:    isDark ? [205, 208, 214] : [60, 66, 76],
        ink4:    isDark ? [150, 152, 158] : [110, 115, 124],
        surface: isDark ? [44, 48, 56]    : [255, 255, 255],
        border:  isDark ? [74, 80, 90]    : [218, 220, 226],
        grid:    isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)',
      });
      let P = buildPalette();

      // Slice the dataset to the active window (12 / 26 / 52 weeks). The
      // window is shared with the segmented control via localStorage so a
      // page-level Alpine handler can update it from outside the partial.
      const fullWeeks = data.weeks;
      const getWindow = () => parseInt(localStorage.getItem('flowChartWindow') || '12');
      const slice = w => fullWeeks.slice(-Math.min(w, fullWeeks.length));

      let sliced = slice(getWindow());

      const ctx = document.getElementById('helpdesk-flow-chart').getContext('2d');
      const chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: sliced.map(w => w.label),
          datasets: [
            {
              label: 'Nye sager',
              data: sliced.map(w => w.new),
              borderColor: rgba(P.info, 1),
              backgroundColor: function(c) {
                // Area fill picks up the tweaks-panel accent — line colour
                // stays --chart-info so the two series remain distinct.
                const g = c.chart.ctx.createLinearGradient(0, 0, 0, 240);
                g.addColorStop(0, rgba(P.accent, 0.20));
                g.addColorStop(1, rgba(P.accent, 0));
                return g;
              },
              borderWidth: 2.25, fill: true, tension: 0.3,
              pointRadius: 3, pointHoverRadius: 5,
              pointBackgroundColor: rgba(P.info, 1),
              pointBorderColor: rgba(P.surface, 1),
              pointBorderWidth: 1.5,
            },
            {
              label: 'Lukkede sager',
              data: sliced.map(w => w.closed),
              borderColor: rgba(P.good, 1),
              backgroundColor: function(c) {
                const g = c.chart.ctx.createLinearGradient(0, 0, 0, 240);
                g.addColorStop(0, rgba(P.good, 0.14));
                g.addColorStop(1, rgba(P.good, 0));
                return g;
              },
              borderWidth: 2.25, fill: true, tension: 0.3,
              borderDash: [6, 4],
              pointRadius: 3, pointHoverRadius: 5,
              pointBackgroundColor: rgba(P.good, 1),
              pointBorderColor: rgba(P.surface, 1),
              pointBorderWidth: 1.5,
            }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: rgba(P.surface, 0.98),
              titleColor:      rgba(P.ink,  1),
              bodyColor:       rgba(P.ink2, 1),
              borderColor:     rgba(P.border, 1),
              borderWidth: 1,
              titleFont: { family: 'JetBrains Mono', size: 11 },
              bodyFont:  { family: 'Inter Tight', size: 12 },
              padding: 10,
              cornerRadius: 8,
              displayColors: true,
              boxPadding: 4,
              usePointStyle: true,
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: rgba(P.ink4, 1), font: { family: 'JetBrains Mono', size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } },
            y: { beginAtZero: true, grid: { color: P.grid, drawBorder: false, borderDash: [2, 4] }, ticks: { color: rgba(P.ink4, 1), font: { family: 'JetBrains Mono', size: 10 } } }
          }
        }
      });

      // Reference the latest chart + dataset on `window` so the segmented
      // control's event handler updates whichever chart is currently mounted
      // (HTMX swaps the partial every 60s; the handler always finds the
      // freshest instance instead of holding a reference to a dead canvas).
      window._helpdeskFlowChart = chart;
      window._helpdeskFlowData  = fullWeeks;
      if (!window._helpdeskFlowListenerBound) {
        window._helpdeskFlowListenerBound = true;
        window.addEventListener('flow-chart-window', e => {
          const c = window._helpdeskFlowChart;
          const f = window._helpdeskFlowData;
          if (!c || !f) return;
          const s = f.slice(-Math.min(e.detail, f.length));
          c.data.labels = s.map(w => w.label);
          c.data.datasets[0].data = s.map(w => w.new);
          c.data.datasets[1].data = s.map(w => w.closed);
          c.update();
        });
        // Re-tint the "Nye sager" area fill when the tweaks-panel accent
        // (or dark mode) changes. Lines stay on --chart-info / --chart-good
        // so the two series remain distinct regardless of accent.
        window.addEventListener('accent-change', () => {
          const c = window._helpdeskFlowChart;
          if (!c) return;
          const np = buildPalette();
          c.data.datasets[0].backgroundColor = function(ctx) {
            const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 240);
            g.addColorStop(0, rgba(np.accent, 0.20));
            g.addColorStop(1, rgba(np.accent, 0));
            return g;
          };
          c.update();
        });
      }
    })
    .catch(err => {
      console.error('helpdesk-flow-chart:', err);
      const el = document.getElementById('helpdesk-flow-chart');
      if (el) el.parentElement.innerHTML = '<p style="text-align:center; color:var(--ink-4); padding:32px 0;">Kunne ikke indlæse data</p>';
    });
  }, 50);
})();
</script>
