{# Flow chart — new vs closed, parent provides card wrapper. #}
<div style="padding: 0 24px 16px;">
  <div class="relative" style="height: 240px;">
    <canvas id="helpdesk-flow-chart"></canvas>
  </div>
</div>

<script>
(function() {
  // Probe a CSS color (any space) into [r,g,b]. Canvas's color stop parser
  // accepts rgba() reliably; modern color spaces like oklch with alpha are
  // not consistently supported.
  function probeRgb(css) {
    const probe = document.createElement('span');
    probe.style.color = css;
    probe.style.display = 'none';
    document.body.appendChild(probe);
    const computed = getComputedStyle(probe).color;
    document.body.removeChild(probe);
    const m = computed.match(/-?\d+(?:\.\d+)?/g);
    if (!m || m.length < 3) return [0, 0, 0];
    return [parseFloat(m[0]), parseFloat(m[1]), parseFloat(m[2])];
  }
  function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

  setTimeout(function() {
    fetch('{% url "dashboard:api-helpdesk-data" %}', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(data => {
      if (!data.weeks || data.weeks.length === 0) {
        document.getElementById('helpdesk-flow-chart').parentElement.innerHTML =
          '<p style="text-align:center; color:var(--ink-4); padding:32px 0;">Ingen data tilgængelig</p>';
        return;
      }
      const isDark = document.documentElement.classList.contains('dark');
      const infoRgb = probeRgb('var(--info)');
      const goodRgb = probeRgb('var(--good)');
      const ink4    = rgba(probeRgb('var(--ink-4)'), 1);
      const hairline = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';

      const ctx = document.getElementById('helpdesk-flow-chart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.weeks.map(w => w.label),
          datasets: [
            {
              label: 'Nye sager',
              data: data.weeks.map(w => w.new),
              borderColor: rgba(infoRgb, 1),
              backgroundColor: function(c) {
                const g = c.chart.ctx.createLinearGradient(0,0,0,240);
                g.addColorStop(0, rgba(infoRgb, 0.14));
                g.addColorStop(1, rgba(infoRgb, 0));
                return g;
              },
              borderWidth: 2, fill: true, tension: 0.3,
              pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: rgba(infoRgb, 1),
            },
            {
              label: 'Lukkede sager',
              data: data.weeks.map(w => w.closed),
              borderColor: rgba(goodRgb, 1),
              backgroundColor: function(c) {
                const g = c.chart.ctx.createLinearGradient(0,0,0,240);
                g.addColorStop(0, rgba(goodRgb, 0.11));
                g.addColorStop(1, rgba(goodRgb, 0));
                return g;
              },
              borderWidth: 2, fill: true, tension: 0.3,
              pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: rgba(goodRgb, 1),
            }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: rgba(probeRgb('var(--surface-1)'), 1),
              titleColor: rgba(probeRgb('var(--ink-1)'), 1),
              bodyColor: rgba(probeRgb('var(--ink-2)'), 1),
              borderColor: rgba(probeRgb('var(--hairline-strong)'), 1),
              borderWidth: 1,
              titleFont: { family: 'JetBrains Mono', size: 11 },
              bodyFont:  { family: 'Inter Tight', size: 12 },
              padding: 10,
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: ink4, font: { family: 'JetBrains Mono', size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } },
            y: { beginAtZero: true, grid: { color: hairline, drawBorder: false, borderDash: [2,4] }, ticks: { color: ink4, font: { family: 'JetBrains Mono', size: 10 } } }
          }
        }
      });
    })
    .catch(err => {
      console.error('helpdesk-flow-chart:', err);
      const el = document.getElementById('helpdesk-flow-chart');
      if (el) el.parentElement.innerHTML = '<p style="text-align:center; color:var(--ink-4); padding:32px 0;">Kunne ikke indlæse data</p>';
    });
  }, 50);
})();
</script>
