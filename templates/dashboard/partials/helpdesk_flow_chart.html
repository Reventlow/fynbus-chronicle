{# Flow chart — new vs closed, parent provides card wrapper. #}
<div style="padding: 0 24px 16px;">
  <div class="relative" style="height: 240px;">
    <canvas id="helpdesk-flow-chart"></canvas>
  </div>
</div>

<script>
(function() {
  setTimeout(function() {
    fetch('{% url "dashboard:api-helpdesk-data" %}', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(data => {
      if (!data.weeks || data.weeks.length === 0) {
        document.getElementById('helpdesk-flow-chart').parentElement.innerHTML =
          '<p style="text-align:center; color:var(--ink-4); padding:32px 0;">Ingen data tilgængelig</p>';
        return;
      }
      const cs = getComputedStyle(document.documentElement);
      const info = cs.getPropertyValue('--info').trim();
      const good = cs.getPropertyValue('--good').trim();
      const ink4 = cs.getPropertyValue('--ink-4').trim();
      const isDark = document.documentElement.classList.contains('dark');
      const hairline = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';

      const ctx = document.getElementById('helpdesk-flow-chart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.weeks.map(w => w.label),
          datasets: [
            {
              label: 'Nye sager',
              data: data.weeks.map(w => w.new),
              borderColor: info,
              backgroundColor: function(c) { const g = c.chart.ctx.createLinearGradient(0,0,0,240); g.addColorStop(0, info + '22'); g.addColorStop(1, info + '00'); return g; },
              borderWidth: 2, fill: true, tension: 0.3,
              pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: info,
            },
            {
              label: 'Lukkede sager',
              data: data.weeks.map(w => w.closed),
              borderColor: good,
              backgroundColor: function(c) { const g = c.chart.ctx.createLinearGradient(0,0,0,240); g.addColorStop(0, good + '1c'); g.addColorStop(1, good + '00'); return g; },
              borderWidth: 2, fill: true, tension: 0.3,
              pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: good,
            }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: cs.getPropertyValue('--surface-1').trim(),
              titleColor: cs.getPropertyValue('--ink-1').trim(),
              bodyColor: cs.getPropertyValue('--ink-2').trim(),
              borderColor: cs.getPropertyValue('--hairline-strong').trim(),
              borderWidth: 1,
              titleFont: { family: 'JetBrains Mono', size: 11 },
              bodyFont:  { family: 'Inter Tight', size: 12 },
              padding: 10,
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: ink4, font: { family: 'JetBrains Mono', size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } },
            y: { beginAtZero: true, grid: { color: hairline, drawBorder: false, borderDash: [2,4] }, ticks: { color: ink4, font: { family: 'JetBrains Mono', size: 10 } } }
          }
        }
      });
    })
    .catch(err => {
      console.error('helpdesk-flow-chart:', err);
      const el = document.getElementById('helpdesk-flow-chart');
      if (el) el.parentElement.innerHTML = '<p style="text-align:center; color:var(--ink-4); padding:32px 0;">Kunne ikke indlæse data</p>';
    });
  }, 50);
})();
</script>
