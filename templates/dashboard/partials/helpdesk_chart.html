{# Helpdesk open-tickets chart — chart canvas + stats grid (parent provides card wrapper). #}
<div style="padding: 0 24px 16px;">
  <div class="relative" style="height: 240px;">
    <canvas id="helpdesk-chart"></canvas>
  </div>
</div>

<div class="grid grid-cols-3" style="border-top: 1px solid var(--hairline); padding: 14px 24px;">
  <div class="text-center">
    <div id="stat-min-open" class="num" style="font-size: 18px; font-weight: 600; color: var(--good-ink); letter-spacing: -0.02em;">—</div>
    <div class="label-eyebrow" style="font-size: 10px; margin-top: 2px;">Laveste</div>
  </div>
  <div class="text-center" style="border-left: 1px solid var(--hairline); border-right: 1px solid var(--hairline);">
    <div id="stat-current-open" class="num" style="font-size: 18px; font-weight: 600; color: var(--ink-1); letter-spacing: -0.02em;">—</div>
    <div class="label-eyebrow" style="font-size: 10px; margin-top: 2px;">Nuværende</div>
  </div>
  <div class="text-center">
    <div id="stat-max-open" class="num" style="font-size: 18px; font-weight: 600; color: var(--bad-ink); letter-spacing: -0.02em;">—</div>
    <div class="label-eyebrow" style="font-size: 10px; margin-top: 2px;">Højeste</div>
  </div>
</div>

<script>
(function() {
  function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

  setTimeout(function() {
    fetch('{% url "dashboard:api-helpdesk-data" %}', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(data => {
      if (!data.weeks || data.weeks.length === 0) {
        document.getElementById('helpdesk-chart').parentElement.innerHTML =
          '<p style="text-align:center; color:var(--ink-4); padding:32px 0;">Ingen data tilgængelig</p>';
        return;
      }
      // Slice to active window — shared with the segmented control via
      // localStorage (key: openChartWindow). Stats are computed on the
      // sliced range so they reflect what's visible.
      const fullWeeks = data.weeks;
      const slice = w => fullWeeks.slice(-Math.min(w, fullWeeks.length));
      const updateStats = sliced => {
        const opens = sliced.map(w => w.open);
        document.getElementById('stat-min-open').textContent = Math.min(...opens);
        document.getElementById('stat-current-open').textContent = opens[opens.length - 1] || 0;
        document.getElementById('stat-max-open').textContent = Math.max(...opens);
      };

      let sliced = slice(parseInt(localStorage.getItem('openChartWindow') || '12'));
      updateStats(sliced);

      // OKLCH → sRGB. Newer Chromium serialises authored oklch() colors
      // back to `oklch(L C H)` from getComputedStyle().color, so we have
      // to do the conversion ourselves rather than trusting a generic
      // number-extraction regex.
      const oklchToRgb = (L, C, H) => {
        const a = C * Math.cos(H * Math.PI / 180);
        const b = C * Math.sin(H * Math.PI / 180);
        const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
        const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
        const s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
        let r =  4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
        let g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
        let bl = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
        const enc = x => x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055;
        const clamp = x => Math.max(0, Math.min(1, x));
        return [
          Math.round(clamp(enc(r))  * 255),
          Math.round(clamp(enc(g))  * 255),
          Math.round(clamp(enc(bl)) * 255),
        ];
      };
      // Probe a CSS color (oklch / var()) through a hidden element. Tries
      // rgb(), then oklch(), then #rrggbb in that order before giving up.
      const probeRgb = css => {
        const probe = document.createElement('span');
        probe.style.cssText = 'position:absolute;left:-9999px;visibility:hidden;color:' + css;
        document.body.appendChild(probe);
        const computed = getComputedStyle(probe).color;
        document.body.removeChild(probe);
        const rgbM = computed.match(/rgba?\s*\(\s*(\d+(?:\.\d+)?)[\s,]+(\d+(?:\.\d+)?)[\s,]+(\d+(?:\.\d+)?)/i);
        if (rgbM) return [Math.round(+rgbM[1]), Math.round(+rgbM[2]), Math.round(+rgbM[3])];
        const oklM = computed.match(/oklch\s*\(\s*(\d*\.?\d+%?)\s+(\d*\.?\d+)\s+(\d*\.?\d+)/i);
        if (oklM) {
          const L = oklM[1].endsWith('%') ? parseFloat(oklM[1]) / 100 : parseFloat(oklM[1]);
          return oklchToRgb(L, parseFloat(oklM[2]), parseFloat(oklM[3]));
        }
        const hexM = computed.match(/^#([0-9a-f]{6})$/i);
        if (hexM) {
          const h = hexM[1];
          return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
        }
        return [0, 0, 0];
      };

      const isDark = document.documentElement.classList.contains('dark');
      const buildPalette = () => ({
        // Single-series chart so we can use the editorial --accent directly:
        // changing the tweaks-panel accent visibly retints the curve.
        accent: probeRgb('var(--accent)'),
        ink:     isDark ? [240, 240, 240] : [25, 30, 38],
        ink2:    isDark ? [205, 208, 214] : [60, 66, 76],
        ink4:    isDark ? [150, 152, 158] : [110, 115, 124],
        surface: isDark ? [44, 48, 56]    : [255, 255, 255],
        border:  isDark ? [74, 80, 90]    : [218, 220, 226],
        grid:    isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)',
      });
      let P = buildPalette();

      const ctx = document.getElementById('helpdesk-chart').getContext('2d');
      const chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: sliced.map(w => w.label),
          datasets: [{
            label: 'Åbne sager',
            data: sliced.map(w => w.open),
            borderColor: rgba(P.accent, 1),
            borderWidth: 2.25,
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointHoverRadius: 5,
            pointBackgroundColor: rgba(P.accent, 1),
            pointBorderColor: rgba(P.surface, 1),
            pointBorderWidth: 1.5,
            backgroundColor: function(c) {
              const g = c.chart.ctx.createLinearGradient(0, 0, 0, 240);
              g.addColorStop(0, rgba(P.accent, 0.22));
              g.addColorStop(1, rgba(P.accent, 0));
              return g;
            },
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: rgba(P.surface, 0.98),
              titleColor:      rgba(P.ink,  1),
              bodyColor:       rgba(P.ink2, 1),
              borderColor:     rgba(P.border, 1),
              borderWidth: 1,
              titleFont: { family: 'JetBrains Mono', size: 11 },
              bodyFont:  { family: 'Inter Tight', size: 12 },
              padding: 10,
              cornerRadius: 8,
              displayColors: false,
              callbacks: { label: c => 'Åbne sager: ' + c.parsed.y }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: rgba(P.ink4, 1), font: { family: 'JetBrains Mono', size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } },
            y: { beginAtZero: false, grid: { color: P.grid, drawBorder: false }, ticks: { color: rgba(P.ink4, 1), font: { family: 'JetBrains Mono', size: 10 } } }
          }
        }
      });

      // Expose the latest chart + dataset on window so the segmented
      // control's event handler updates whichever chart is currently
      // mounted (HTMX swaps the partial every 60s).
      window._openChart = chart;
      window._openChartData = fullWeeks;
      if (!window._openChartListenerBound) {
        window._openChartListenerBound = true;
        window.addEventListener('open-chart-window', e => {
          const c = window._openChart;
          const f = window._openChartData;
          if (!c || !f) return;
          const s = f.slice(-Math.min(e.detail, f.length));
          c.data.labels = s.map(w => w.label);
          c.data.datasets[0].data = s.map(w => w.open);
          c.update();
          updateStats(s);
        });
        // Re-probe --accent when the user toggles the tweaks panel's
        // accent or dark mode, then refresh the chart's colour stops.
        window.addEventListener('accent-change', () => {
          const c = window._openChart;
          if (!c) return;
          const np = buildPalette();
          const ds = c.data.datasets[0];
          ds.borderColor = rgba(np.accent, 1);
          ds.pointBackgroundColor = rgba(np.accent, 1);
          ds.pointBorderColor = rgba(np.surface, 1);
          ds.backgroundColor = function(ctx) {
            const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 240);
            g.addColorStop(0, rgba(np.accent, 0.22));
            g.addColorStop(1, rgba(np.accent, 0));
            return g;
          };
          c.update();
        });
      }
    })
    .catch(err => {
      console.error('helpdesk-chart:', err);
      const el = document.getElementById('helpdesk-chart');
      if (el) el.parentElement.innerHTML = '<p style="text-align:center; color:var(--ink-4); padding:32px 0;">Kunne ikke indlæse data</p>';
    });
  }, 50);
})();
</script>
