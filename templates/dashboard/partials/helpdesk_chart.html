{# Helpdesk open-tickets chart — chart canvas + stats grid (parent provides card wrapper). #}
<div style="padding: 0 24px 16px;">
  <div class="relative" style="height: 240px;">
    <canvas id="helpdesk-chart"></canvas>
  </div>
</div>

<div class="grid grid-cols-3" style="border-top: 1px solid var(--hairline); padding: 14px 24px;">
  <div class="text-center">
    <div id="stat-min-open" class="num" style="font-size: 18px; font-weight: 600; color: var(--good-ink); letter-spacing: -0.02em;">—</div>
    <div class="label-eyebrow" style="font-size: 10px; margin-top: 2px;">Laveste</div>
  </div>
  <div class="text-center" style="border-left: 1px solid var(--hairline); border-right: 1px solid var(--hairline);">
    <div id="stat-current-open" class="num" style="font-size: 18px; font-weight: 600; color: var(--ink-1); letter-spacing: -0.02em;">—</div>
    <div class="label-eyebrow" style="font-size: 10px; margin-top: 2px;">Nuværende</div>
  </div>
  <div class="text-center">
    <div id="stat-max-open" class="num" style="font-size: 18px; font-weight: 600; color: var(--bad-ink); letter-spacing: -0.02em;">—</div>
    <div class="label-eyebrow" style="font-size: 10px; margin-top: 2px;">Højeste</div>
  </div>
</div>

<script>
(function() {
  function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

  setTimeout(function() {
    fetch('{% url "dashboard:api-helpdesk-data" %}', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(data => {
      if (!data.weeks || data.weeks.length === 0) {
        document.getElementById('helpdesk-chart').parentElement.innerHTML =
          '<p style="text-align:center; color:var(--ink-4); padding:32px 0;">Ingen data tilgængelig</p>';
        return;
      }
      const openCases = data.weeks.map(w => w.open);
      const minOpen = Math.min(...openCases), maxOpen = Math.max(...openCases);
      const currentOpen = openCases[openCases.length - 1] || 0;
      document.getElementById('stat-min-open').textContent = minOpen;
      document.getElementById('stat-current-open').textContent = currentOpen;
      document.getElementById('stat-max-open').textContent = maxOpen;

      const isDark = document.documentElement.classList.contains('dark');
      const cs = getComputedStyle(document.documentElement);
      // Accept both `rgb(r, g, b)` and `#rrggbb` since cssnano minifies the
      // former into the latter when running through Tailwind's build.
      const rgbVar = name => {
        const v = cs.getPropertyValue(name).trim();
        const rgbM = v.match(/rgb\s*\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
        if (rgbM) return [parseInt(rgbM[1]), parseInt(rgbM[2]), parseInt(rgbM[3])];
        const hexM = v.match(/^#?([0-9a-f]{6})$/i);
        if (hexM) {
          const h = hexM[1];
          return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
        }
        return [0, 0, 0];
      };
      const P = {
        accent: rgbVar('--chart-accent'),
        ink:     isDark ? [240, 240, 240] : [25, 30, 38],
        ink2:    isDark ? [205, 208, 214] : [60, 66, 76],
        ink4:    isDark ? [150, 152, 158] : [110, 115, 124],
        surface: isDark ? [44, 48, 56]    : [255, 255, 255],
        border:  isDark ? [74, 80, 90]    : [218, 220, 226],
        grid:    isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)',
      };

      const ctx = document.getElementById('helpdesk-chart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.weeks.map(w => w.label),
          datasets: [{
            label: 'Åbne sager',
            data: openCases,
            borderColor: rgba(P.accent, 1),
            borderWidth: 2.25,
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointHoverRadius: 5,
            pointBackgroundColor: rgba(P.accent, 1),
            pointBorderColor: rgba(P.surface, 1),
            pointBorderWidth: 1.5,
            backgroundColor: function(c) {
              const g = c.chart.ctx.createLinearGradient(0, 0, 0, 240);
              g.addColorStop(0, rgba(P.accent, 0.22));
              g.addColorStop(1, rgba(P.accent, 0));
              return g;
            },
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: rgba(P.surface, 0.98),
              titleColor:      rgba(P.ink,  1),
              bodyColor:       rgba(P.ink2, 1),
              borderColor:     rgba(P.border, 1),
              borderWidth: 1,
              titleFont: { family: 'JetBrains Mono', size: 11 },
              bodyFont:  { family: 'Inter Tight', size: 12 },
              padding: 10,
              cornerRadius: 8,
              displayColors: false,
              callbacks: { label: c => 'Åbne sager: ' + c.parsed.y }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: rgba(P.ink4, 1), font: { family: 'JetBrains Mono', size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } },
            y: { beginAtZero: false, grid: { color: P.grid, drawBorder: false }, ticks: { color: rgba(P.ink4, 1), font: { family: 'JetBrains Mono', size: 10 } } }
          }
        }
      });
    })
    .catch(err => {
      console.error('helpdesk-chart:', err);
      const el = document.getElementById('helpdesk-chart');
      if (el) el.parentElement.innerHTML = '<p style="text-align:center; color:var(--ink-4); padding:32px 0;">Kunne ikke indlæse data</p>';
    });
  }, 50);
})();
</script>
