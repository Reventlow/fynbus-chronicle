# Production-style Docker Compose for Chronicle — mirrors the real stack.
#
# The live production file is docker-compose/chronicle/compose.yml in the
# FynBus/infrastructure-as-code repository (Portainer stack "chronicle",
# GitOps). This copy is a runnable example of the same shape:
#
#   CHRONICLE_VERSION=1.0.3 docker compose -f docker-compose.prod.yml up -d
#
# - web and sync share one SQLite database (the data volume) and MUST run
#   the same version: bump both image tags together.
# - web applies migrations on start (docker/entrypoint.sh); sync waits for
#   them before it syncs (run_scheduler.wait_for_migrations).
# - Settings come from env files, never from this file. See .env.example
#   and docs/SETUP.md for the variables; sync needs SECRET_KEY, SQLITE_DIR
#   and the SERVICEDESK_* settings, web needs the rest (and SERVICEDESK_*
#   too for the dashboard's sync button).
# - Behind a reverse proxy, list every origin (including a non-443 port)
#   in CSRF_TRUSTED_ORIGINS, or every form submit fails with 403.
services:
  web:
    image: elohite/chronicle:${CHRONICLE_VERSION:?set CHRONICLE_VERSION, e.g. 1.0.3}
    container_name: chronicle-web
    restart: unless-stopped
    env_file: ./env/web.env
    ports:
      - "8000:8000"
    volumes:
      - chronicle_data:/app/data          # SQLite, report videos, pasted images
      - chronicle_static:/app/staticfiles

  sync:
    image: elohite/chronicle_sync_servicedesk:${CHRONICLE_VERSION:?set CHRONICLE_VERSION, e.g. 1.0.3}
    container_name: chronicle-sync
    restart: unless-stopped
    env_file: ./env/sync.env
    volumes:
      - chronicle_data:/app/data
    depends_on:
      - web

volumes:
  chronicle_data:
  chronicle_static:
